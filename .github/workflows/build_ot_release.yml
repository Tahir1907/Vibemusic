name: Build APKs for release
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Accept SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Setup signing configs
        run: |
          mkdir -p app
          if [ -n "$KEYSTORE" ] && [ -n "$KEYSTORE_PROPERTIES" ]; then
            echo "$KEYSTORE" | base64 --decode > test.jks
            echo "$KEYSTORE" | base64 --decode > app/test.jks
            echo "$KEYSTORE_PROPERTIES" > keystore.properties
          else
            echo "Secrets missing, generating auto-signing release key..."
            keytool -genkeypair -v -keystore app/test.jks -keyalg RSA -keysize 2048 -validity 10000 -alias ot_alias -storepass android -keypass android -dname "CN=Vibemusic, OU=Dev, O=Vibemusic, L=City, S=State, C=US"
            cp app/test.jks test.jks
            cat <<EOF > keystore.properties
          storeFile=test.jks
          keyAlias=ot_alias
          keyPassword=android
          storePassword=android
          EOF
          fi
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}

      - name: Get date-time string
        id: datetime
        run: |
          DATE_TAG=$(date +'%Y-%m-%d_%H-%M-%S')
          echo "date_tag=$DATE_TAG" >> $GITHUB_ENV

      - name: Resolve ffMetadataEx and FFmpeg libs
        run: |
          rm -rf ffMetadataEx ../ffMetadataEx
          git clone https://github.com/OuterTune/ffMetadataEx -b vibebur-128 ffMetadataEx
          git clone https://github.com/mikooomich/ffmpeg-android-maker-prebuilt/ -b audio ffMetadataEx/ffmpeg-android-maker
          ln -s $(pwd)/ffMetadataEx ../ffMetadataEx || true

          python3 -c '
          import re
          with open("ffMetadataEx/build.gradle.kts", "r") as f:
              content = f.read()

          # Replace broken catalog plugins block with direct plugin IDs
          content = re.sub(r"plugins\s*\{[^}]*\}", "plugins {\n    id(\"com.android.library\")\n    id(\"org.jetbrains.kotlin.android\")\n}", content, count=1)

          # Inject namespace and compileSdk into android block
          if "namespace" not in content:
              content = re.sub(r"android\s*\{", "android {\n    namespace = \"com.dd3boh.outertune.ffmetadataex\"\n    compileSdk = 35", content, count=1)

          with open("ffMetadataEx/build.gradle.kts", "w") as f:
              f.write(content)
          '

      - name: Configure media submodules
        run: |
          if [ -d "media" ]; then
            python3 -c '
            import glob, re
            for path in glob.glob("media/**/build.gradle.kts", recursive=True):
                with open(path, "r") as f:
                    c = f.read()
                c = re.sub(r"plugins\s*\{[^}]*\}", "plugins {\n    id(\"com.android.library\")\n    id(\"org.jetbrains.kotlin.android\")\n}", c, count=1)
                if "compileSdk" not in c:
                    c = re.sub(r"android\s*\{", "android {\n    compileSdk = 35", c, count=1)
                with open(path, "w") as f:
                    f.write(c)
            ' || true
          fi

      - name: Build core release APK
        run: ./gradlew assembleCoreRelease

      - name: Build full release APK
        run: ./gradlew assembleFullRelease

      - name: Create github release draft
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.date_tag }}
          name: "Build ${{ env.date_tag }}"
          draft: true
          files: |
            app/build/outputs/apk/core/release/*.apk
            app/build/outputs/apk/full/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.REL_TOKEN }}
