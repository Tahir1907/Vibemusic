name: Force Sync Branch
on:
  push:
    branches: [ dev-online ]
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git remote add upstream https://github.com/OuterTune/OuterTune.git
          git fetch upstream
          git checkout upstream/dev -- .
          git checkout HEAD -- .github/workflows
          git commit -m "Sync code from OuterTune dev" || true
          git push origin dev-online
